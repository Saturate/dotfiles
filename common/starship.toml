# Starship Prompt Configuration
# p10k-inspired look, shared across macOS, Linux, and Windows

command_timeout = 500
add_newline = true

# Two-line prompt with powerline style
format = """
[](blue)\
[$directory](bg:blue fg:white bold)\
[](fg:blue bg:yellow)\
[$git_branch$git_status](bg:yellow fg:black)\
[](fg:yellow)\
$nodejs$python$rust$golang$docker_context$dotnet\
$fill\
$cmd_duration\
$time\
$line_break\
$character"""

right_format = ""

[fill]
symbol = " "

[directory]
format = "[ $path ]($style)"
style = "bg:blue fg:white bold"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[ $symbol$branch ]($style)"
style = "bg:yellow fg:black"
symbol = " "

[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "bg:yellow fg:black"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕"
untracked = "?${count}"
modified = "!${count}"
staged = "+${count}"
deleted = "✘${count}"
conflicted = "~${count}"

[character]
success_symbol = "[❯](bold cyan)"
error_symbol = "[❯](bold red)"

[time]
disabled = false
format = "[ at $time]($style)"
style = "dimmed white"
time_format = "%H:%M:%S"

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "
style = "dimmed yellow"

[nodejs]
format = "[ $symbol$version](green) "
symbol = " "

[python]
format = "[ $symbol$version](yellow) "
symbol = " "

[rust]
format = "[ $symbol$version](red) "
symbol = " "

[golang]
format = "[ $symbol$version](cyan) "
symbol = " "

[dotnet]
format = "[ $symbol$version](purple) "
symbol = " "

[docker_context]
format = "[ $symbol$context](blue) "
symbol = " "
